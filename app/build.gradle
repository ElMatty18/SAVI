plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

def localProps = new Properties()
def localFile = rootProject.file('local.properties')
if (localFile.exists()) {
    localFile.withInputStream { localProps.load(it) }
}

android {
    namespace 'com.tangorra.matias.savi'
    compileSdk 35

    defaultConfig {
        applicationId "com.tangorra.matias.savi"
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName "1.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // La key de Maps se lee de local.properties (MAPS_API_KEY=...) o de la variable de entorno.
        manifestPlaceholders = [
                mapsApiKey: localProps.getProperty('MAPS_API_KEY', System.getenv('MAPS_API_KEY') ?: '')
        ]
        buildConfigField 'boolean', 'USAR_EMULADOR', 'false'
    }

    buildTypes {
        // Igual a debug pero contra el emulador local de Firebase (cd tools && npm run emulador).
        // Se instala como una app aparte ("SAVI emu") para no mezclarla con la que usa produccion.
        emulador {
            initWith debug
            applicationIdSuffix ".emu"
            versionNameSuffix "-emu"
            matchingFallbacks = ['debug']
            buildConfigField 'boolean', 'USAR_EMULADOR', 'true'
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.gridlayout:gridlayout:1.1.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.percentlayout:percentlayout:1.0.0'
    implementation 'androidx.lifecycle:lifecycle-process:2.9.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.9.4'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.9.4'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    // Firebase
    implementation platform('com.google.firebase:firebase-bom:34.3.0')
    implementation 'com.google.firebase:firebase-database'
    implementation 'com.google.firebase:firebase-storage'
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-auth'

    implementation 'com.google.android.gms:play-services-maps:19.2.0'
    implementation 'com.google.android.gms:play-services-location:21.3.0'

    // UI
    implementation 'com.mig35:carousellayoutmanager:1.4.6' // Carrusel
    implementation 'de.hdodenhof:circleimageview:3.1.0' // Imagen circular
    implementation 'com.github.bumptech.glide:glide:4.16.0' // Descarga y recorte de imagenes

    // Codigo QR
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'com.google.zxing:core:3.5.3'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
